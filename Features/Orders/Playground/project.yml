name: Playground
include:
  - ../../../scripts/playground-base.yml

packages:
  SunKit:
    url: https://github.com/JarvanSun/SunKit.git
    minorVersion: 0.2.2
  Orders:
    path: ..
  FinanceCore:
    path: ../../../Core/FinanceCore
  DesignSystem:
    path: ../../../Core/DesignSystem

targets:
  OrdersPlayground:
    templates:
      - Playground
    sources:
      - Sources
    dependencies:
      - package: Orders
      - package: FinanceCore
      - package: DesignSystem
      - package: SunKit
        product: SunUserInterface
